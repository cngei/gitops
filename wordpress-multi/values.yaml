image:
  repository: ghcr.io/cngei/sezioni-wp
  tag: "85a56f85791f66274c625f060b3ca8bc41a390b4"
  pullPolicy: IfNotPresent
imagePullSecrets: []

mariadb:
  # Install this release in the same namespace as the existing MariaDB CR.
  name: wordpress-multi-mariadb
  # Retain database/user/grant CRs on uninstall and skip SQL deletion if removed.
  keepResources: true
  cleanupPolicy: Skip

persistence:
  size: 2Gi
  storageClass: longhorn-multi-wordpress
  accessModes:
    - ReadWriteOnce
  keep: true

certificate:
  issuerRef:
    name: le-cert-issuer
    kind: ClusterIssuer
    group: cert-manager.io

ingress:
  entryPoints:
    http: web
    https: websecure

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
nodeSelector:
  node-role.kubernetes.io/worker: wordpress
tolerations: []
affinity: {}

probes:
  startup:
    failureThreshold: 180
    periodSeconds: 10

cron:
  enabled: true
  schedule: "*/5 * * * *"
  image: curlimages/curl:8.23.0
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

sites:
    - domain: aosta.cngei.it

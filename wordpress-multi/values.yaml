image:
  repository: ghcr.io/cngei/sezioni-wp
  tag: "37396c94ac2de4d0b9bc780f216d779aa3015e91"
  pullPolicy: IfNotPresent
imagePullSecrets: []

mariadb:
  # Install this release in the same namespace as the existing MariaDB CR.
  name: wordpress-multi-mariadb
  # Retain database/user/grant CRs on uninstall and skip SQL deletion if removed.
  keepResources: true
  cleanupPolicy: Skip

persistence:
  size: 2Gi
  storageClass: longhorn-multi-wordpress
  accessModes:
    - ReadWriteOnce
  keep: true

certificate:
  issuerRef:
    name: le-cert-issuer
    kind: ClusterIssuer
    group: cert-manager.io

ingress:
  entryPoints:
    http: web
    https: websecure

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
nodeSelector:
  node-role.kubernetes.io/worker: wordpress
tolerations: []
affinity: {}

probes:
  startup:
    failureThreshold: 180
    periodSeconds: 10

cron:
  enabled: true
  schedule: "*/5 * * * *"
  image: curlimages/curl:8.23.0
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

externalSecrets:
  enabled: true
  apiVersion: external-secrets.io/v1
  # Immutable orphaned targets keep generated credentials stable across upgrades.
  keep: true
  databaseHost: "" # Defaults to <mariadb.name>.<namespace>.svc.cluster.local:3306.
  password:
    length: 32
    digits: 4
    symbols: 0
    noUpper: false
    allowRepeat: true
  extraEnv: {}
  pushSecret:
    enabled: false
    apiVersion: external-secrets.io/v1alpha1
    refreshInterval: 1h
    # Empty name uses the namespace-local store created by vaultwarden.enabled.
    secretStoreRef:
      name: ""
      kind: SecretStore

vaultwarden:
  enabled: false
  server: https://password.cngei.it
  # Bootstrap outside Git: client-id, client-secret, master-password.
  credentialsSecret: wordpress-vaultwarden-credentials
  cliImage: ghcr.io/charlesthomas/bitwarden-cli:2026.10.1
  bridgeImage: python:3.13-slim-bookworm
  itemNamePrefix: "Kubernetes WordPress: "
  organizationId: "39707e44-2513-4bc9-9209-e1f84e6e285b"
  collectionIds: ["21d3ccad-4f23-4ccb-b855-180d049a4f2f"]
  folderId: ""
  externalSecretsNamespace: external-secrets
  externalSecretsPodSelector:
    app.kubernetes.io/name: external-secrets
  resources:
    cli:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    bridge:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

sites:
  - domain: aosta.cngei.it
    adminEmail: paolo.campanelli@cngei.it

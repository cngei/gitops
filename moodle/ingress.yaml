apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: moodle-ingress
  namespace: moodle
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`moodle.cngei.it`)
      services:
        - kind: Service
          name: moodle
          port: 8080
  tls:
    secretName: moodle-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: moodle-cert
  namespace: moodle
spec:
  secretName: moodle-tls
  dnsNames:
    - moodle.cngei.it
  issuerRef:
    name: le-cert-issuer
    kind: ClusterIssuer
